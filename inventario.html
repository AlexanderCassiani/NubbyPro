<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NubbyPro - Sistema de inventario</title>
    <link rel="stylesheet" href="inventario.css" />
    <link rel="icon" href="icon/logo.png" type="image/png" />
  </head>
  <body>
    <div class="app">
      <div class="contenedor-sidebar-mobile">
        <button id="sidebar-mobile-btn">X</button>
        <aside class="sidebar-mobile">
          <nav>
            <ul>
              <li class="link-btn" id="mostrar-dashboard">
                <a>Dashboard</a>
              </li>
              <li class="link-btn" id="mostrar-productos">
                <a>Productos</a>
              </li>
            </ul>
          </nav>
        </aside>
      </div>

      <aside class="sidebar">
        <div class="contenedor-logo">
          <img class="logo" src="icon/logo.png" alt="Logo de NubbyPro" />
          <h1>NubbyPro</h1>
        </div>
        <nav>
          <ul>
            <li class="link-btn" id="mostrar-dashboard">
              <img src="icon/dashboard.svg" alt="Dashboard" />
              <a>Dashboard</a>
            </li>
            <li class="link-btn" id="mostrar-productos">
              <img src="icon/productos.svg" alt="Productos" />
              <a>Productos</a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="dashboard">
        <h2>Dashboard</h2>
        <div class="contenedor-tarjetas">
          <div class="tarjeta">
            <div>
              <img src="icon/totalProducto.png" alt="Total de productos" />
              <strong>Productos</strong>
            </div>
            <span id="total-productos">0</span>
          </div>
          <div class="tarjeta">
            <div>
              <img src="icon/enStock.png" alt="Producto en stock" />
              <strong>Precio total del inventario</strong>
            </div>
            <span id="precio-total">0</span>
          </div>
        </div>

        <section class="contenedor-graficas">
          <div class="contenedor-grafica-categoria">
            <canvas id="grafica-categoria"></canvas>
          </div>
        </section>
      </main>

      <main class="producto">
        <header>
          <h2>Productos</h2>
          <button id="btn-producto">
            <img src="icon/agregarProducto.svg" alt="Agregar producto" />
            Agregar producto
          </button>
        </header>

        <div class="contenedor-filtros">
          <input
            type="text"
            id="filtro-nombre"
            placeholder="Buscar producto por nombre o categoría"
          />
          <select id="filtro-categoria" value="Seleccionar categoría">
            <option value="todas">todas las categorias</option>
            <option value="electrodomesticos">electrodomesticos</option>
            <option value="ropa">ropa</option>
            <option value="calzado">calzado</option>
            <option value="videojuegos">videojuegos</option>
            <option value="accesorio">accesorio</option>
          </select>
        </div>

        <div class="contenedor-tabla">
          <table id="tabla">
            <thead>
              <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="overlay">
          <div class="modal">
            <h2>Agregar producto</h2>
            <div>
              <label for="id">Id:</label>
              <input
                type="number"
                class="input numero"
                id="id"
                placeholder="Ejem: 0001"
              />
            </div>
            <div>
              <label for="nombre">Nombre: </label>
              <input
                type="text"
                id="nombre"
                class="input"
                placeholder="Lavadora"
                maxlength="35"
              />
            </div>
            <div>
              <label for="categoria">Categoría: </label>
              <select id="categoria" value="Seleccionar categoría">
                <option value="electrodomesticos">electrodomesticos</option>
                <option value="ropa">ropa</option>
                <option value="calzado">calzado</option>
                <option value="videojuegos">videojuegos</option>
                <option value="accesorio">accesorio</option>
              </select>
            </div>
            <div class="contenedor-crear-categoria">
              <div>
                <label>Crear categoria</label>
                <button
                  title="Crear una categoria personalizada"
                  id="btn-mostrar-contenedor-categoria"
                >
                  <img src="icon/crearCategoria.svg" alt="Crear categoria" />
                </button>
              </div>

              <div id="contenedor-nueva-categoria">
                <input class="input" type="text" id="input-categoria" />
                <button id="agregar-categoria">Añadir categoria</button>
              </div>
            </div>
            <div>
              <label for="precio">Precio: </label>
              <input
                type="number"
                class="input numero"
                id="precio"
                min="0"
                placeholder="1000000"
              />
            </div>
            <div>
              <label for="cantidad">Cantidad: </label>
              <input
                type="number"
                class="input numero"
                id="cantidad"
                min="0"
                placeholder="10"
              />
            </div>
            <button id="agregar-producto">Agregar producto</button>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
