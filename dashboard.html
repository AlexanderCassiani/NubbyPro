<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NubbyPro - Sistema de inventario</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>NubbyPro</h1>
      </aside>
      <main>
        <h2>Dashboard</h2>
        <div class="contenedor-tarjetas">
          <div class="tarjeta">
            <div>
              <img src="icon/totalProducto.png" alt="Total de productos" />
              <strong>Productos</strong>
            </div>
            <span>50</span>
          </div>
          <div class="tarjeta">
            <div>
              <img src="icon/enStock.png" alt="Producto en stock" />
              <strong>En stock</strong>
            </div>
            <span>30</span>
          </div>
          <div class="tarjeta">
            <div>
              <img src="icon/stockBajo.png" alt="Stock bajo" />
              <strong>Stock bajo</strong>
            </div>
            <span>10</span>
          </div>
          <div class="tarjeta">
            <div>
              <img src="icon/agotado.png" alt="Producto agotado" />
              <strong>Agotado</strong>
            </div>
            <span>5</span>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
